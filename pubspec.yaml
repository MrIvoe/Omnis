name: omnis
description: A micro-kernel music engine with a hot-swappable plugin ecosystem.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Localization infrastructure (see l10n.yaml, lib/l10n/app_en.arb).
  # Scaffolding only for now: task 4 wires it through the new Settings
  # search and onboarding screens, since those cost nothing extra to
  # build correctly from the start — retrofitting every existing
  # screen's hardcoded strings is real, separate work for later.
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  # --- Shared, dependency-free contracts also used by omnis_plugins
  #     (the bundled-plugin package) — see packages/omnis_plugin_api.
  #     Declared as a (self-referential) git dependency, not a local
  #     path, at the exact url+path omnis_plugins' own pubspec.yaml uses
  #     to reach it — that's what lets pub treat both edges as one
  #     consistent source and resolve without any override. A plain
  #     `path:` dependency here would make this app want the package by
  #     path while omnis_plugins (fetched via git) wants it by git, and
  #     pub refuses to resolve two different sources for one package. ---
  omnis_plugin_api:
    git:
      url: https://github.com/MrIvoe/Omnis.git
      path: packages/omnis_plugin_api
      ref: plugin-api-v0.22.0
  # --- The bundled plugins themselves, published at
  #     github.com/MrIvoe/Omnis-Plugins. A clean checkout (no
  #     pubspec_overrides.yaml present) resolves straight from GitHub;
  #     pubspec_overrides.yaml (local-only) points this at the sibling
  #     checkout instead for fast local iteration — see that file.
  #     Pinned to a tag, not a floating branch: a push to Omnis-Plugins
  #     must not silently change what this app builds against. Bump the
  #     ref deliberately (its own reviewed commit) when picking up new
  #     plugin-side work on purpose. ---
  omnis_plugins:
    git:
      url: https://github.com/MrIvoe/Omnis-Plugins.git
      ref: v0.42.0
  # --- Core playback ---
  just_audio: ^0.9.36
  audio_service: ^0.18.11
  # --- DI / state ---
  get_it: ^7.2.0
  # --- Plugin installer ---
  http: ^1.2.0
  archive: ^3.6.0
  yaml: ^3.1.2
  path_provider: ^2.1.0
  path: ^1.9.0
  file_picker: ^8.3.7
  permission_handler: ^11.3.1
  on_audio_query: ^2.9.0
  shared_preferences: ^2.2.3
  # --- ID3 tag reading/writing (pure Dart, no native build) ---
  id3_codec: ^1.0.3
  # --- Plugin runtime (dart_eval provides a full Dart interpreter so
  #     downloaded plugins can execute at runtime) ---
  dart_eval: ^0.8.3
  flutter_web_auth_2: ^5.0.3
  youtube_player_iframe: ^5.2.2
  crypto: ^3.0.7
  smtc_windows: ^1.0.0
  geolocator: 12.0.0
  audio_session: ^0.1.25
  set_ringtone: ^1.0.0
  google_fonts: ^6.3.0
  palette_generator: ^0.3.3+7
  # --- Waveform seek bar (Now Playing). Android/iOS/macOS only — no
  #     Windows/Linux/web support, so every call site must degrade to the
  #     plain slider rather than assume this succeeds. See
  #     lib/core/waveform_store.dart's doc comment. ---
  just_waveform: ^0.0.7
  home_widget: ^0.9.2+1
  # About page: GitHub/Discord/donation links, item "About" — already a
  # transitive dependency (pulled in by flutter_web_auth_2/others), now
  # declared directly since it's imported directly.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Used by test/library_store_test.dart to fake the app documents
  # directory. Imported directly, so they must be declared directly.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
  # Used by test/sleep_timer_plugin_test.dart to control time
  # deterministically for the fade-out (real Timer.periodic delays would
  # make that test slow and, on a loaded CI runner, flaky). Already a
  # transitive dependency via flutter_test; declared directly since it's
  # imported directly.
  fake_async: ^1.3.1
  # Used by test/spotify_plugins_test.dart and test/youtube_plugins_test.dart
  # to fake PluginStorage's secure tier (setSecureString/getSecureString)
  # via flutter_secure_storage's own bundled TestFlutterSecureStoragePlatform
  # — same "declared directly since it's imported directly" reasoning as
  # the path_provider/plugin_platform_interface pair above. Already a
  # transitive dependency via omnis_plugin_api.
  flutter_secure_storage: ^9.2.2
  flutter_secure_storage_platform_interface: ^1.1.2
  # Used by test/about_page_test.dart to fake UrlLauncherPlatform so
  # tapping a link doesn't try to open a real browser — same "declared
  # directly since it's imported directly" reasoning as the pairs
  # above (plugin_platform_interface, needed for the same
  # PlatformInterface-mixin pattern, is already declared above).
  # Already a transitive dependency via url_launcher.
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  generate: true