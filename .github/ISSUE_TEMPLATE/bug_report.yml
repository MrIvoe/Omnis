name: Bug report
description: Something in Omnis isn't working the way it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If it's a **downloaded
        plugin** misbehaving rather than Omnis itself, check its own
        repository first — bundled plugins (in this repo) belong here,
        third-party ones belong with their author.

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, if you have them. "I don't have a reliable repro" is a fine answer too.
    validations:
      required: false

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "e.g. Android 14, Windows 11"
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter version
      description: Output of `flutter --version`
      placeholder: "e.g. Flutter 3.x, Dart 3.x"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace / Plugin Health entry
      description: If a plugin crashed, the Plugin Health dashboard (Plugins tab) entry is very useful here.
      render: shell
    validations:
      required: false
