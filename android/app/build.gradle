import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Real release signing, if a keystore is configured (see
// docs/RELEASING.md) — falls back to the debug key below when it isn't,
// so a contributor without a keystore can still build/run --release.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.omnis.music"
    // flutter_web_auth_2 (via androidx.browser 1.9.0) requires compileSdk
    // 36+ — flutter.compileSdkVersion (the Flutter SDK's own default) was
    // still 35 as of this Flutter version, so it's pinned explicitly here
    // rather than left to that default. Safe to raise further later;
    // compileSdk is backward compatible.
    compileSdk = 36
    // webview_flutter_android and a few other plugins now require a newer
    // NDK than flutter.ndkVersion (the Flutter SDK's own default)
    // provides — pinned explicitly for the same reason as compileSdk
    // above.
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.omnis.music"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Signs with the real release keystore when key.properties
            // exists (see docs/RELEASING.md); falls back to the debug
            // key otherwise, so `flutter run --release` still works
            // without one.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
